<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 505" width="1120" height="505" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="505" fill="#ffffff"/>

  <rect x="420" y="6" width="280" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="560" y="23" font-size="13" text-anchor="middle" fill="#1a1a1a">Control stack for R7021E project</text>

  <!-- sources -->
  <rect x="24" y="52" width="220" height="48" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="134" y="71" font-size="12.5" text-anchor="middle" fill="#1a1a1a">Gazebo</text>
  <text x="134" y="89" font-size="10.5" text-anchor="middle" fill="#1a1a1a">plank on the Burger, moving obstacle</text>

  <rect x="310" y="52" width="140" height="48" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="380" y="71" font-size="12.5" text-anchor="middle" fill="#1a1a1a">ros_gz_bridge</text>
  <text x="380" y="89" font-size="10.5" text-anchor="middle" fill="#1a1a1a">(provided)</text>

  <line x1="244" y1="76" x2="302" y2="76" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>

  <path d="M 450 76 H 478 V 112 H 920" fill="none" stroke="#1a1a1a" stroke-width="1.3"/>
  <rect x="512" y="104" width="56" height="16" fill="#ffffff"/>
  <text x="540" y="116" font-size="10" text-anchor="middle" fill="#1a1a1a">gz topics</text>
  <line x1="570" y1="112" x2="570" y2="120" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="745" y1="112" x2="745" y2="120" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="920" y1="112" x2="920" y2="120" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="500" y="128" width="140" height="48" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="570" y="147" font-size="12.5" text-anchor="middle" fill="#1a1a1a">/odom</text>
  <text x="570" y="165" font-size="10.5" text-anchor="middle" fill="#1a1a1a">robot pose</text>

  <rect x="670" y="128" width="150" height="48" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="745" y="147" font-size="12.5" text-anchor="middle" fill="#1a1a1a">/obstacle_pose</text>
  <text x="745" y="165" font-size="10.5" text-anchor="middle" fill="#1a1a1a">where it is now</text>

  <rect x="850" y="128" width="140" height="48" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="920" y="147" font-size="12.5" text-anchor="middle" fill="#1a1a1a">/goal_pose</text>
  <text x="920" y="165" font-size="10.5" text-anchor="middle" fill="#1a1a1a">where it is now</text>

  <!-- our node -->
  <rect x="88" y="206" width="944" height="200" fill="none" stroke="#1a1a1a" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="560" y="222" font-size="11.5" text-anchor="middle" fill="#1a1a1a">mpc_node (written by us)</text>

  <rect x="150" y="248" width="240" height="60" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
  <text x="270" y="272" font-size="12.5" text-anchor="middle" fill="#1a1a1a">obstacle motion model</text>
  <text x="270" y="291" font-size="10.5" text-anchor="middle" fill="#1a1a1a">known path, N steps ahead</text>

  <rect x="440" y="248" width="240" height="60" fill="#f8cecc" stroke="#b85450" stroke-width="1.3"/>
  <text x="560" y="272" font-size="12.5" text-anchor="middle" fill="#1a1a1a">goal estimator</text>
  <text x="560" y="291" font-size="10.5" text-anchor="middle" fill="#1a1a1a">constant velocity fit</text>

  <rect x="730" y="248" width="240" height="60" fill="#e6d98f" stroke="#b89b2e" stroke-width="1.3"/>
  <text x="850" y="272" font-size="12.5" text-anchor="middle" fill="#1a1a1a">body footprint</text>
  <text x="850" y="291" font-size="10.5" text-anchor="middle" fill="#1a1a1a">three discs on the plank</text>

  <rect x="380" y="344" width="360" height="50" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="560" y="364" font-size="12.5" text-anchor="middle" fill="#1a1a1a">MPC solve (do-mpc)</text>
  <text x="560" y="382" font-size="10.5" text-anchor="middle" fill="#1a1a1a">keep-out per disc, bounds, IPOPT as in Lab 2</text>

  <!-- feeds in -->
  <path d="M 745 176 V 196 H 200 V 240" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="430" y="188" width="70" height="16" fill="#ffffff"/>
  <text x="465" y="200" font-size="10" text-anchor="middle" fill="#1a1a1a">obstacle now</text>

  <path d="M 920 176 V 228 H 490 V 240" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="690" y="220" width="56" height="16" fill="#ffffff"/>
  <text x="718" y="232" font-size="10" text-anchor="middle" fill="#1a1a1a">goal now</text>

  <path d="M 570 176 V 190 H 104 V 369 H 372" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="190" y="361" width="90" height="16" fill="#ffffff"/>
  <text x="235" y="373" font-size="10" text-anchor="middle" fill="#1a1a1a">x, y, theta</text>

  <!-- new blocks into the solver -->
  <path d="M 270 308 V 324 H 460 V 336" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="320" y="310" width="82" height="16" fill="#ffffff"/>
  <text x="361" y="322" font-size="10" text-anchor="middle" fill="#1a1a1a">future centres</text>

  <line x1="560" y1="308" x2="560" y2="336" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="570" y="314" width="66" height="16" fill="#ffffff"/>
  <text x="603" y="326" font-size="10" text-anchor="middle" fill="#1a1a1a">future goal</text>

  <path d="M 850 308 V 324 H 660 V 336" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="712" y="310" width="80" height="16" fill="#ffffff"/>
  <text x="752" y="322" font-size="10" text-anchor="middle" fill="#1a1a1a">keep-out discs</text>

  <!-- outputs -->
  <rect x="300" y="430" width="240" height="52" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="420" y="450" font-size="12.5" text-anchor="middle" fill="#1a1a1a">/cmd_vel</text>
  <text x="420" y="468" font-size="10.5" text-anchor="middle" fill="#1a1a1a">forward speed and turn rate</text>

  <path d="M 460 394 V 412 H 420 V 422" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="468" y="404" width="60" height="16" fill="#ffffff"/>
  <text x="498" y="416" font-size="10" text-anchor="middle" fill="#1a1a1a">first input</text>

  <path d="M 300 456 H 56 V 106" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="120" y="448" width="104" height="16" fill="#ffffff"/>
  <text x="172" y="460" font-size="10" text-anchor="middle" fill="#1a1a1a">through the bridge</text>

  <rect x="640" y="420" width="360" height="72" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.3"/>
  <text x="820" y="443" font-size="12.5" text-anchor="middle" fill="#1a1a1a">evaluation harness</text>
  <text x="820" y="462" font-size="10.5" text-anchor="middle" fill="#1a1a1a">clearance, narrowest gap, tracking error,</text>
  <text x="820" y="479" font-size="10.5" text-anchor="middle" fill="#1a1a1a">solve time per tick</text>

  <line x1="700" y1="394" x2="700" y2="412" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="708" y="396" width="58" height="16" fill="#ffffff"/>
  <text x="737" y="408" font-size="10" text-anchor="middle" fill="#1a1a1a">solve time</text>

  <path d="M 134 52 V 38 H 1060 V 456 H 1008" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="848" y="30" width="78" height="16" fill="#ffffff"/>
  <text x="887" y="42" font-size="10" text-anchor="middle" fill="#1a1a1a">ground truth</text>
</svg>
